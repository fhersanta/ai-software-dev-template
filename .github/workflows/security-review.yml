# Revisión de seguridad con Claude en cada PR.
# Requiere el secreto CLAUDE_API_KEY en el repositorio; sin él se omite.
# No está endurecida contra prompt injection: solo corre en PR del propio
# repositorio, nunca en forks.
name: security-review
on:
  pull_request:
permissions:
  pull-requests: write
  contents: read
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.CLAUDE_API_KEY != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_KEY != 'true'
        run: echo "::notice::CLAUDE_API_KEY no está configurado; se omite la revisión de seguridad."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@main
        if: env.HAS_KEY == 'true'
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
