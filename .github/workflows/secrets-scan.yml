# Escaneo de secretos sobre todo el historial.
# Usa el binario de gitleaks en contenedor: la acción oficial exige licencia
# de pago en repositorios de organizaciones.
name: secrets-scan
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1
