# Escaneo de secretos con el binario de gitleaks (licencia MIT).
# No se usa gitleaks-action: exige una clave de licencia en organizaciones.
name: secrets-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1
